name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: 2.0.0
            rubygems: 2.7.8
          - ruby: 2.1.9
            rubygems: 2.7.8
          - ruby: 2.2
            rubygems: 2.7.8
          - ruby: 2.3.4
          - ruby: 2.4.1
          - ruby: 2.5.1
          - ruby: 2.6.0
          - ruby: 2.7.5
          - ruby: 3.0.3
          - ruby: 3.1.0
          - ruby: ruby-head
          - ruby: jruby-9.1
          - ruby: jruby-head
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java for JRuby 9.1
      if: startsWith(matrix.ruby, 'jruby-9.1')
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '8'
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        rubygems: ${{ matrix.rubygems }}
    - name: Install bundler
      run: gem install bundler --no-document -v '~> 1.13'
    - name: Install gems
      run: bundle install --jobs 4
    - run: unset JRUBY_OPTS
    - name: Run rake
      run: bundle exec rake
